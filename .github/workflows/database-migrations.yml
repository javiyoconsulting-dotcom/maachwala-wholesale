name: Validate database migrations

on:
  pull_request:
    paths:
      - 'database/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-migrations.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wholesale_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wholesale_migration_test
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run db:validate
